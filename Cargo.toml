[package]
name = "dictaphile"
version = "0.1.0"
edition = "2024"
license = "MIT"

[build-dependencies]
winres = "0.1"

[dependencies]
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.6"
enigo = "0.2"
anyhow = "1"
parking_lot = "0.12"
tao = "0.30"  # event loop for hotkeys
toml = "0.8"
tray-icon = "0.22.1"
muda = "0.17"
